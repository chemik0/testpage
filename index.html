<script>
(function(){
  var btn=document.getElementById('menuBtn'),menu=document.getElementById('menu'),
      close=document.getElementById('menuClose'),scrim=document.getElementById('scrim');
  function set(open){
    menu.setAttribute('data-open',open);scrim.setAttribute('data-open',open);
    btn.setAttribute('aria-expanded',open);
    document.body.style.overflow = open ? 'hidden' : '';
  }
  btn.addEventListener('click',function(){set(menu.getAttribute('data-open')!=='true');});
  scrim.addEventListener('click',function(){set(false);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')set(false);});

  var f=document.getElementById('formKontakt');
  if(f && f.getAttribute('data-demo')==='true'){
    f.addEventListener('submit',function(e){
      e.preventDefault();
      var st=document.getElementById('formStatus');
      if(!f.checkValidity()){ f.reportValidity(); return; }
      st.textContent='Formularz działa w trybie demonstracyjnym — wysyłka nie jest jeszcze podłączona.';
    });
  }
})();
</script>
